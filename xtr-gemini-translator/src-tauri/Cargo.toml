[package]
name = "xtr-gemini"
version = "0.1.0"
description = "X-TR Gemini Translator (Alduin)"
authors = ["Alduin Builder"]
edition = "2021"
license = "MIT"
default-run = "xtr-gemini"
publish = false
 
[build-dependencies]
tauri-build = { version = "2", features = ["config-json5"] }
 
[dependencies]
tauri = { version = "2", features = ["config-json5"] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-stronghold = { version = "2", features = ["kdf"] }
 
rusqlite = { version = "0.37", features = ["bundled", "serde_json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
quick-xml = "0.31"
roxmltree = "0.19"
similar = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
time = "0.3"
rand = "0.8"
tokio-util = "0.7"
once_cell = "1"
futures = "0.3"
blake3 = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
